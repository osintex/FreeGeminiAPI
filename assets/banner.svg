<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#0e1124" />
      <stop offset="100%" stop-color="#140c24" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e8cff" />
      <stop offset="50%" stop-color="#9d50ff" />
      <stop offset="100%" stop-color="#ff6584" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)" />
  <rect width="1198" height="358" x="1" y="1" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="#9d50ff" opacity="0.12" filter="url(#glow)" />
  <circle cx="950" cy="180" r="130" fill="#4e8cff" opacity="0.10" filter="url(#glow)" />

  <!-- Gemini Star Icon -->
  <g transform="translate(140, 110)">
    <path d="M 70 0 C 70 38.6 38.6 70 0 70 C 38.6 70 70 101.4 70 140 C 70 101.4 101.4 70 140 70 C 101.4 70 70 38.6 70 0 Z" fill="url(#geminiGrad)" filter="url(#glow)" />
    <path d="M 70 18 C 70 46.7 46.7 70 18 70 C 46.7 70 70 93.3 70 122 C 70 93.3 93.3 70 122 70 C 93.3 70 70 46.7 70 18 Z" fill="#ffffff" opacity="0.85" />
    <circle cx="70" cy="70" r="10" fill="#ffffff" />
  </g>

  <!-- Main Title -->
  <text x="330" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#geminiGrad)" letter-spacing="-0.5">FreeGeminiAPI</text>

  <!-- Subtitle -->
  <text x="330" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#cfd6e6">
    Local OpenAI, Codex Responses &amp; Anthropic Messages Bridge
  </text>

  <!-- Feature Badges -->
  <g transform="translate(330, 230)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(78, 140, 255, 0.15)" stroke="rgba(78, 140, 255, 0.35)" />
    <text x="65" y="22" font-family="monospace" font-size="13" font-weight="600" fill="#88b5ff" text-anchor="middle">ZERO-DEP</text>

    <!-- Badge 2 -->
    <rect x="145" y="0" width="165" height="34" rx="8" fill="rgba(157, 80, 255, 0.15)" stroke="rgba(157, 80, 255, 0.35)" />
    <text x="227" y="22" font-family="monospace" font-size="13" font-weight="600" fill="#c99cff" text-anchor="middle">CODEX RESPONSES</text>

    <!-- Badge 3 -->
    <rect x="325" y="0" width="180" height="34" rx="8" fill="rgba(255, 101, 132, 0.15)" stroke="rgba(255, 101, 132, 0.35)" />
    <text x="415" y="22" font-family="monospace" font-size="13" font-weight="600" fill="#ffa1b5" text-anchor="middle">ANTHROPIC MESSAGES</text>

    <!-- Badge 4 -->
    <rect x="520" y="0" width="145" height="34" rx="8" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.35)" />
    <text x="592" y="22" font-family="monospace" font-size="13" font-weight="600" fill="#4facfe" text-anchor="middle">1M+ CONTEXT</text>
  </g>
</svg>
